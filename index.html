<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alicia Coffee Shop - Carta</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #1a1a1a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 10px;
      color: #d4af37;
    }
    .subtitle {
      font-size: 0.95rem;
      color: #aaaaaa;
      margin-bottom: 30px;
    }
    .btn {
      display: inline-block;
      background-color: #d4af37;
      color: #1a1a1a;
      font-weight: bold;
      font-size: 1.1rem;
      padding: 16px 32px;
      border-radius: 50px;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
      transition: background-color 0.2s, transform 0.2s;
      margin-bottom: 20px;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .hint {
      font-size: 0.8rem;
      color: #777777;
      max-width: 300px;
    }
  </style>
</head>
<body>

  <div class="logo">Alicia Coffee Shop</div>
  <div class="subtitle">Carta Digital / Menu (ES / EN)</div>

  <!-- Enlace directo al PDF optimizado para móviles -->
  <a href="./Alicia-Coffeeshop-Carta-Movil-ES-EN.pdf" class="btn" target="_blank">
    📖 Abrir Carta / Menu
  </a>
